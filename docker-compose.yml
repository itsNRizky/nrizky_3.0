services:
  nrizky:
    build: .
    container_name: nrizky
    restart: always

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - IP_HASH_SALT=${IP_HASH_SALT}

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nrizky.rule=Host(`nrizky.com`)"
      - "traefik.http.routers.nrizky.entrypoints=websecure"
      - "traefik.http.routers.nrizky.tls.certresolver=le"
      - "traefik.http.services.nrizky.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-proxy"

    networks:
      - traefik-proxy
      - db

networks:
  traefik-proxy:
    external: true
  db:
    external: true
